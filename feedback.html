<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Форма обратной связи во всплывающем окне.">
    <title>Sanamer | Обратная связь</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/feedback.css">
    <link rel="icon" href="ssssssss.jpg" sizes="any">
    <script src="js/feedback.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="container d-flex flex-column flex-md-row align-items-md-center justify-content-md-between gap-3 py-3 py-md-4">
        <a class="brand d-inline-flex align-items-center gap-3" href="index.html" aria-label="На главную страницу">
            <span class="brand-logo" aria-hidden="true">S</span>
            <span>Sanamer — учебный сайт</span>
        </a>
        <nav class="site-nav d-flex flex-column flex-md-row gap-1" aria-label="Основная навигация">
            <a class="px-3 py-2 rounded" href="index.html">Главная</a>
        </nav>
    </div>
</header>

<main class="container py-4 py-md-5">
    <section class="content-section p-4 p-md-5" id="feedback-section" aria-labelledby="feedback-title">
        <h1 id="feedback-title" class="mb-2">Обратная связь</h1>
        <p class="section-intro mb-4">Есть вопрос или предложение? Нажмите на кнопку, заполните форму, и мы свяжемся с вами.</p>
        <button type="button" id="open-form" class="py-2 px-4">Написать нам</button>
    </section>
</main>

<dialog class="popup" id="popup" aria-labelledby="popup-title">
    <div class="popup-body">
        <button type="button" class="popup-close" id="popup-close" aria-label="Закрыть форму">&times;</button>
        <h2 id="popup-title" class="popup-title">Обратная связь</h2>

        <form class="feedback-form" id="feedback-form" action="https://formcarry.com/s/-I4ONdW2AkH" method="post" accept-charset="UTF-8">
            <div class="form-field">
                <label for="fullname">ФИО:</label>
                <input type="text" name="fullname" id="fullname" required placeholder=" "
                       pattern="\s*\p{L}[\p{L}\-]*(\s+\p{L}[\p{L}\-]*)+\s*"
                       title="Введите имя и фамилию через пробел, только буквы">
            </div>
            <div class="form-field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" pattern="[0-9+ ]{10,}" title="Не менее 10 символов: цифры, пробелы и знак +" required>
            </div>
            <div class="form-field">
                <label for="organization">Организация:</label>
                <input type="text" id="organization" name="organization" autocomplete="organization">
            </div>
            <div class="form-field">
                <label for="message">Сообщение:</label>
                <textarea id="message" name="message" rows="3" required></textarea>
            </div>
            <label class="agreement d-flex align-items-start gap-2">
                <input type="checkbox" name="agreement" class="mt-1" required>
                <span>Согласен с <a href="privacy.html" target="_blank" rel="noopener">политикой обработки персональных данных</a></span>
            </label>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            <button type="submit" id="send-button" class="py-2 px-4">Отправить</button>
        </form>
    </div>
</dialog>

<footer class="site-footer py-4">
    <div class="container text-center">
        © 2026 Sanamer. Учебная работа по разработке Web-интерфейса.<br>
        Контактные данные: maxagurbek@gmail.com
    </div>
</footer>

</body>
</html>
